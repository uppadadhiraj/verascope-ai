[pytest]
# Without this, a bare `pytest` run from backend/ recurses into data/ --
# the runtime storage for cloned repos and Fix Agent workspaces (gitignored,
# populated as soon as anyone ingests a repo through the app). Those are
# other projects' source trees, not this project's tests; pytest trying to
# collect their own tests/test_*.py files with this venv fails immediately
# on missing dependencies and aborts the whole run before any real test
# executes. Scoping collection to tests/ keeps it hermetic regardless of
# what's been ingested locally.
testpaths = tests
